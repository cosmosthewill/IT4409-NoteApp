<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{page.error.404.title})}"></head>
<body class="d-flex flex-column min-vh-100 error-page">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container text-center">
        <div class="error-code">404</div>
        <span class="error-icon"><i class="bi bi-journal-x"></i></span>
        <h1 class="h2 mt-4" th:text="#{error.404.heading}">Không tìm thấy</h1>
        <p class="text-body-secondary error-copy mx-auto" th:text="#{error.404.text}"></p>
        <a class="btn btn-primary rounded-pill px-4" th:href="@{/notes}">
            <i class="bi bi-grid me-2"></i><span th:text="#{error.notes}">Danh sách ghi chú</span>
        </a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
