<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
                <i class="bi bi-journal-richtext"></i>
            </span>
            <span th:text="#{app.name}">Ghi Chú</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <i class="bi bi-list fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1 py-3 py-lg-0">
                <a sec:authorize="isAuthenticated()"
                   class="nav-link"
                   th:href="@{/notes}">
                    <i class="bi bi-grid me-1"></i>
                    <span th:text="#{nav.notes}">Ghi chú</span>
                </a>
                <a sec:authorize="isAuthenticated()"
                   class="nav-link"
                   th:href="@{/notes/new}">
                    <i class="bi bi-plus-lg me-1"></i>
                    <span th:text="#{nav.newNote}">Ghi chú mới</span>
                </a>

                <div class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle border-0 bg-transparent"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <i class="bi bi-translate me-1"></i>
                        <span th:text="#{nav.language}">Ngôn ngữ</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item d-flex justify-content-between gap-3"
                               href="?lang=vi">
                                <span th:text="#{language.vi}">Tiếng Việt</span>
                                <i th:if="${#locale.language == 'vi'}" class="bi bi-check2"></i>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex justify-content-between gap-3"
                               href="?lang=en">
                                <span th:text="#{language.en}">English</span>
                                <i th:if="${#locale.language == 'en'}" class="bi bi-check2"></i>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle border-0 bg-transparent"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <i class="bi bi-circle-half me-1"></i>
                        <span th:text="#{nav.theme}">Giao diện</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <button class="dropdown-item theme-option" type="button" data-theme-value="light">
                                <i class="bi bi-sun me-2"></i>
                                <span th:text="#{theme.light}">Sáng</span>
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item theme-option" type="button" data-theme-value="dark">
                                <i class="bi bi-moon-stars me-2"></i>
                                <span th:text="#{theme.dark}">Tối</span>
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item theme-option" type="button" data-theme-value="system">
                                <i class="bi bi-display me-2"></i>
                                <span th:text="#{theme.system}">Theo hệ thống</span>
                            </button>
                        </li>
                    </ul>
                </div>

                <div sec:authorize="isAuthenticated()" class="nav-user d-flex align-items-center gap-2 mx-lg-2">
                    <span class="avatar-sm" aria-hidden="true">
                        <i class="bi bi-person"></i>
                    </span>
                    <span class="small fw-semibold" sec:authentication="name">username</span>
                </div>

                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 w-100" type="submit">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        <span th:text="#{nav.logout}">Đăng xuất</span>
                    </button>
                </form>

                <div sec:authorize="isAnonymous()" class="d-flex flex-column flex-lg-row gap-2 ms-lg-2">
                    <a class="btn btn-link text-body text-decoration-none" th:href="@{/login}"
                       th:text="#{nav.login}">Đăng nhập</a>
                    <a class="btn btn-primary rounded-pill px-4" th:href="@{/register}"
                       th:text="#{nav.register}">Đăng ký</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
