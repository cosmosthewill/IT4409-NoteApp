<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="deleteModal"
     class="modal fade"
     id="deleteNoteModal"
     tabindex="-1"
     aria-labelledby="deleteNoteModalLabel"
     aria-hidden="true"
     th:attr="data-message-template=#{note.deleteMessage}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <div class="modal-icon-danger" aria-hidden="true">
                    <i class="bi bi-trash3"></i>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-3">
                <h2 class="h5" id="deleteNoteModalLabel" th:text="#{note.deleteTitle}">Xóa ghi chú?</h2>
                <p class="text-body-secondary mb-0" id="deleteNoteMessage"></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{note.cancel}">
                    Hủy
                </button>
                <form id="deleteNoteForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger" th:text="#{note.deleteConfirm}">
                        Xóa ghi chú
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
