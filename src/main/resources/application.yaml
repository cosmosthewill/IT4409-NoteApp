spring:
  application:
    name: note-app
  profiles:
    default: dev
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Bangkok
  thymeleaf:
    encoding: UTF-8

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

app:
  demo:
    username: ${DEMO_USERNAME:demo}
    email: ${DEMO_EMAIL:demo@example.com}
    password: ${DEMO_PASSWORD:demo12345}
